[project]
name = "doc-extraction-poc"
version = "0.1.0"
description = "Image quality assessment and model-selection pipeline for document extraction"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pytesseract>=0.3.10",
    "openai>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"