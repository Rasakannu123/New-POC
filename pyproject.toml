[project]
name = "doc-extraction-demo"
version = "0.1.0"
description = "PDF to structured JSON via a LangGraph document-extraction pipeline"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pytesseract>=0.3.10",
    "openai>=1.0.0",
    "langgraph>=0.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]

[tool.setuptools]
packages = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
