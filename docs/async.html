<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Async — Concurrency Model</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Async · Concurrency Model</p>
    <h1>Async — one thread, cooperative suspend and resume</h1>
    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="async-title async-desc">
      <title id="async-title">Async concurrency model</title>
      <desc id="async-desc">A single-threaded event loop runs one coroutine until it awaits I/O, switches to another, and resumes the first when its I/O completes.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="160" y1="76" x2="160" y2="552" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="430" y1="76" x2="430" y2="552" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="690" y1="76" x2="690" y2="552" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="900" y1="76" x2="900" y2="552" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <rect x="156" y="112" width="8" height="420" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="426" y="112" width="8" height="92" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="426" y="472" width="8" height="60" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="686" y="244" width="8" height="92" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <line x1="160" y1="112" x2="428" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="265" y="92" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="295" y="101" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUN()</text>

      <path d="M 434,148 H 474 V 172 H 442" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="482" y="156" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="486" y="165" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">WORK</text>

      <line x1="430" y1="204" x2="162" y2="204" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="259" y="184" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="295" y="193" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AWAIT I/O</text>

      <line x1="160" y1="244" x2="688" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="395" y="224" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="425" y="233" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUN()</text>

      <path d="M 694,280 H 734 V 304 H 702" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="742" y="288" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="746" y="297" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">WORK</text>

      <line x1="690" y1="336" x2="162" y2="336" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="389" y="316" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="425" y="325" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AWAIT I/O</text>

      <path d="M 164,372 H 204 V 396 H 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="212" y="380" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="216" y="389" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">POLL()</text>

      <line x1="900" y1="432" x2="162" y2="432" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="490" y="412" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="530" y="421" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">A READY</text>

      <line x1="160" y1="472" x2="428" y2="472" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="260" y="452" width="70" height="12" rx="2" fill="#f5f5f5"/>
      <text x="295" y="461" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESUME()</text>

      <path d="M 434,508 H 474 V 532 H 442" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="482" y="516" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="486" y="525" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CONTINUE</text>

      <rect x="80" y="32" width="160" height="44" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="160" y="54" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Event Loop</text>
      <text x="160" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1 thread</text>

      <rect x="350" y="32" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="430" y="54" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Coroutine A</text>
      <text x="430" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">async def</text>

      <rect x="610" y="32" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="690" y="54" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Coroutine B</text>
      <text x="690" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">async def</text>

      <rect x="820" y="32" width="160" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="900" y="54" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OS I/O</text>
      <text x="900" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">socket</text>

      <line x1="30" y1="572" x2="970" y2="572" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="592" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="110" y1="588" x2="134" y2="588" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="142" y="592" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CALL</text>
      <line x1="210" y1="588" x2="234" y2="588" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="242" y="592" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SUSPEND</text>
      <line x1="330" y1="588" x2="354" y2="588" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="362" y="592" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RESUME</text>
    </svg>
  </div>
</body>
</html>
